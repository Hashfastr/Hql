[project]
name = "pyhql"
version = "0.0.11"
authors = [
    { name="Sylvain Jones", email="sylvainjones+hql@hashfastr.com" },
]
maintainers = [
    { name="Sylvain Jones", email="sylvainjones+hql@hashfastr.com" },
]
description = "Hash query language, a universal Query Language"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    #"Intended Audience :: DFIR",
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "polars==1.43.2",
    "polars_runtime_32 @ https://github.com/Hashfastr/Hql/releases/download/polars-bin/polars_runtime_32-1.43.2-cp314-cp314t-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "polars_runtime_32 @ https://github.com/Hashfastr/Hql/releases/download/polars-bin/polars_runtime_32-1.43.2-cp314-cp314t-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polars_runtime_32 @ https://github.com/Hashfastr/Hql/releases/download/polars-bin/polars_runtime_32-1.43.2-cp314-cp314t-manylinux_2_28_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polars_runtime_32 @ https://github.com/Hashfastr/Hql/releases/download/polars-bin/polars_runtime_32-1.43.2-cp314-cp314t-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'x86_64'",
    "antlr4-python3-runtime==4.13.2",
    "elasticsearch",
    "splunk-sdk",
    "numpy",
    "requests",
    "ndjson",
    "oyaml",
    # "opensearch-py",
    "aiohttp",
    "boto3",
    "fastapi",
    "uvicorn",
    # "dfir_iris_client",
    "azure-kusto-data"
]

[project.urls]
Homepage = "https://github.com/Hashfastr/Hql"
Issues = "https://github.com/Hashfastr/Hql/issues"

[dependency-groups]
notebooks = ["marimo"]
dev = ["pytest"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["Hql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.marimo.runtime]
auto_reload = "modules"
watcher_on_save = "autorun" 
