name: Build Polars runtime wheels

on:
  workflow_dispatch:
    inputs:
      polars_runtime_version:
        description: "polars-runtime-32 version to build (leave empty to read from uv.lock)"
        required: false
        type: string
      publish_release:
        description: "Upload built wheels to the polars-bin release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  polars-runtime:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            artifact: macos-arm64
            wheel_pattern: "*cp314-cp314t-macosx_11_0_arm64.whl"
          - runner: macos-15-intel
            arch: x86_64
            artifact: macos-x86_64
            wheel_pattern: "*cp314-cp314t-macosx_10_12_x86_64.whl"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            artifact: manylinux-aarch64
            base_image: quay.io/pypa/manylinux_2_28_aarch64
            wheel_pattern: "*cp314-cp314t-manylinux_2_28_aarch64.whl"
          - runner: ubuntu-24.04
            arch: x86_64
            artifact: manylinux-x86_64
            base_image: quay.io/pypa/manylinux_2_28_x86_64
            wheel_pattern: "*cp314-cp314t-manylinux_2_28_x86_64.whl"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.14t
        run: uv python install 3.14t

      - name: Set up Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve polars-runtime-32 version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.polars_runtime_version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            echo "value=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/.*"polars==\([0-9][0-9.]*\)".*/\1/p' pyproject.toml | head -1)
            if [ -z "$v" ]; then
              echo "ERROR: no 'polars==<version>' pin in pyproject.toml" >&2
              exit 1
            fi
            echo "value=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Create build venv
        run: |
          uv venv --python 3.14t "$RUNNER_TEMP/venv"
          if [ "${{ runner.os }}" = "macOS" ]; then
            uv pip install --python "$RUNNER_TEMP/venv/bin/python" pip maturin
          fi

      - name: Download polars-runtime-32 sdist
        if: runner.os == 'macOS'
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/venv/bin/python" -m pip download \
              --no-binary=:all: --no-deps \
              "polars-runtime-32==${POLARS_RUNTIME_VERSION}" \
              -d "$RUNNER_TEMP/src"
          tar -xzf "$RUNNER_TEMP/src/polars_runtime_32-${POLARS_RUNTIME_VERSION}.tar.gz" \
              -C "$RUNNER_TEMP/src"

      - name: Build wheel
        if: runner.os == 'macOS'
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "0"
        working-directory: ${{ runner.temp }}/src/polars_runtime_32-${{ steps.version.outputs.value }}
        run: |
          "$RUNNER_TEMP/venv/bin/maturin" build --release \
              --interpreter "$RUNNER_TEMP/venv/bin/python" \
              --out "$GITHUB_WORKSPACE/dist"

      - name: Prepare manylinux builder
        if: runner.os == 'Linux'
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="polars-runtime-builder:${{ matrix.arch }}"
          docker build \
              --build-arg "BASE_IMAGE=${{ matrix.base_image }}" \
              --build-arg "POLARS_RUNTIME_VERSION=${POLARS_RUNTIME_VERSION}" \
              --file scripts/Containerfile.polars \
              --tag "$image" \
              .

      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        timeout-minutes: 150
        run: |
          image="polars-runtime-builder:${{ matrix.arch }}"
          container="polars-runtime-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_dir="$RUNNER_TEMP/polars-target-${{ matrix.arch }}"
          mkdir -p dist
          mkdir -p "$target_dir"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Starting resource-bounded Cargo build with two parallel jobs"
          docker run \
              --init \
              --network none \
              --name "$container" \
              --env CARGO_BUILD_JOBS=2 \
              --mount "type=bind,src=$target_dir,dst=/cargo-target" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/dist,dst=/out" \
              "$image" &
          docker_pid=$!

          (
            while kill -0 "$docker_pid" 2>/dev/null; do
              sleep 60
              kill -0 "$docker_pid" 2>/dev/null || exit 0
              echo "::notice::Polars manylinux build is still running"
              docker stats --no-stream \
                  --format 'container={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}}' \
                  "$container" || true
              free -h || true
              df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" || true
            done
          ) &
          heartbeat_pid=$!

          status=0
          wait "$docker_pid" || status=$?
          kill "$heartbeat_pid" >/dev/null 2>&1 || true
          wait "$heartbeat_pid" 2>/dev/null || true

          if ! state=$(docker inspect \
              --format 'exit={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{.State.Error}}' \
              "$container" 2>&1); then
            state="unavailable; Docker inspect failed: $state"
          fi
          echo "Container result: $state"
          if [ "$status" -ne 0 ]; then
            echo "ERROR: manylinux build container failed: $state" >&2
            exit "$status"
          fi

      - name: Verify wheel
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          pattern='${{ matrix.wheel_pattern }}'
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name "$pattern" -print -quit)
          if [ -z "$wheel" ]; then
            echo "ERROR: expected wheel matching $pattern" >&2
            find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -print >&2
            exit 1
          fi
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-deps \
              "polars==${POLARS_RUNTIME_VERSION}" "$wheel"
          "$RUNNER_TEMP/venv/bin/python" -c \
              "import polars as pl; assert pl.DataFrame({'value': [1]}).height == 1"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: polars-runtime-32-${{ matrix.artifact }}-py314t
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish wheel to release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view polars-bin >/dev/null 2>&1 || \
              gh release create polars-bin --title "Prebuilt Polars wheels"
          gh release upload polars-bin dist/*.whl --clobber

  polars-runtime-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.14t
        run: uv python install 3.14t

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve polars-runtime-32 version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.polars_runtime_version }}
        run: |
          if ($env:REQUESTED_VERSION) {
            "value=$env:REQUESTED_VERSION" >> $env:GITHUB_OUTPUT
          } else {
            $match = Select-String -Path pyproject.toml -Pattern '"polars==([0-9.]+)"'
            if (-not $match.Matches) {
              Write-Error "No polars version pin found in pyproject.toml"
              exit 1
            }
            "value=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          }

      - name: Create build venv
        shell: pwsh
        run: |
          uv venv --python 3.14t "$env:RUNNER_TEMP/venv"
          uv pip install --python "$env:RUNNER_TEMP/venv/Scripts/python.exe" pip maturin

      - name: Download polars-runtime-32 sdist
        shell: pwsh
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/src" | Out-Null
          & "$env:RUNNER_TEMP/venv/Scripts/python.exe" -m pip download `
              --no-binary=:all: --no-deps `
              "polars-runtime-32==$env:POLARS_RUNTIME_VERSION" `
              -d "$env:RUNNER_TEMP/src"
          tar -xzf "$env:RUNNER_TEMP/src/polars_runtime_32-$env:POLARS_RUNTIME_VERSION.tar.gz" `
              -C "$env:RUNNER_TEMP/src"

      - name: Build wheel
        shell: pwsh
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "0"
        working-directory: ${{ runner.temp }}/src/polars_runtime_32-${{ steps.version.outputs.value }}
        run: |
          & "$env:RUNNER_TEMP/venv/Scripts/maturin.exe" build --release `
              --interpreter "$env:RUNNER_TEMP/venv/Scripts/python.exe" `
              --out "$env:GITHUB_WORKSPACE/dist"

      - name: Verify wheel
        shell: pwsh
        env:
          POLARS_RUNTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*cp314-cp314t-win_amd64.whl" |
              Select-Object -First 1
          if (-not $wheel) {
            Write-Error "Expected a CPython 3.14t Windows x86_64 wheel"
            Get-ChildItem "$env:GITHUB_WORKSPACE/dist"
            exit 1
          }
          uv pip install --python "$env:RUNNER_TEMP/venv/Scripts/python.exe" --no-deps `
              "polars==$env:POLARS_RUNTIME_VERSION" $wheel.FullName
          & "$env:RUNNER_TEMP/venv/Scripts/python.exe" -c `
              "import polars as pl; assert pl.DataFrame({'value': [1]}).height == 1"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: polars-runtime-32-windows-x86_64-py314t
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish wheel to release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view polars-bin *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create polars-bin --title "Prebuilt Polars wheels"
          }
          gh release upload polars-bin dist/*.whl --clobber
