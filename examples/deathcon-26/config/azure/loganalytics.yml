# Fill in your Log Analytics (Sentinel) workspace here. Used by maps/azure.hql
# when azure_db is 'loganalytics'. workspace_id is the Workspace ID on the
# workspace's Overview blade.
#
# Authenticates as whoever ran `az login`, they need Log Analytics Reader on the
# workspace. To use an app registration instead, set auth to secret and fill in
# client_id, client_secret and tenant_id. Don't commit a real secret.
database:
  name: loganalytics
  type: LogAnalytics
  # HaC's time window is sent as the query timespan
  timeseries: true
  conf:
    workspace_id: 'd8af7f0c-4607-4e1d-b7fb-42d160550b32'
    auth: azcli
    # Only to query a tenant other than the az login default:
    # tenant_id: '<AZURE_TENANT_ID>'
    #
    # auth: secret
    # client_id: '<APPLICATION_CLIENT_ID>'
    # client_secret: '<INJECT_CLIENT_SECRET>'
    # tenant_id: '<AZURE_TENANT_ID>'
