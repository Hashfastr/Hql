database:
  name: 'json'
  type: 'JSON'
  # Static 2022 datasets, HaC's time window would filter out every row
  timeseries: false
  conf:
    local-base: './local-data'
    http-base:  'https://hql.dev/datasets/'
  macro:
    network:
      hql: |
        database('json').http('tf11-so-network.json')