# Placeholder: fill in your Azure Data Explorer cluster here. Don't commit a real
# secret. Used by maps/azure.hql when azure_db is 'kusto'. For a Log Analytics
# workspace use loganalytics.yml instead.
database:
  name: kusto
  type: Kusto
  conf:
    database: '<DATABASE_NAME>'
    cluster: 'https://<CLUSTER>.<REGION>.kusto.windows.net'
    client_id: '<APPLICATION_CLIENT_ID>'
    client_secret: '<INJECT_CLIENT_SECRET>'
    tenant_id: '<AZURE_TENANT_ID>'
